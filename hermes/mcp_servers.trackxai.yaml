# Merge this into config.yaml in the Hermes profile directory, then sign in:
#   hermes mcp login trackxai
mcp_servers:
  trackxai:
    url: "https://trackxai.kalebtec.com/mcp"
    auth: "oauth"
#
# Token fallback: replace the entry above with this one, and put
# TRACKXAI_TOKEN in the .env file beside config.yaml. Never write the token here.
